<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Player</title>
<style>
:root{--bg:#f6f6f9;--surface:#fff;--surface2:#e9e9ef;--text:#16161a;--sub:#6e6e7a;--line:#dcdce3;--sel:#ebe8f4;--accent:#ff4e78;--accent2:#8246eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f12;--surface:#1c1c22;--surface2:#2a2a32;--text:#f4f4f7;--sub:#9a9aa6;--line:#33333c;--sel:#26262e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f12;--surface:#1c1c22;--surface2:#2a2a32;--text:#f4f4f7;--sub:#9a9aa6;--line:#33333c;--sel:#26262e;color-scheme:dark}
html{height:100%}*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
.scr{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.pillbtn{border:1.5px solid var(--line);border-radius:999px;min-height:48px;padding:0 20px;font-weight:700;display:inline-flex;align-items:center;gap:8px;background:none}
.pillbtn svg{width:22px;height:22px}
#lib{overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 56px 150px 16px}
#lib .top{display:flex;align-items:center;gap:12px;margin:12px 0 18px}
.hero{display:flex;align-items:center;gap:18px;margin:8px 0 18px}
.hero .ic{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;flex:none}
.hero .ic svg{width:34px}
.hero h1{font-size:34px;margin:0}
.acts{display:flex;gap:10px;margin-bottom:12px}
.acts .pillbtn{padding:0 16px}
#q{width:100%;min-height:48px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);padding:0 18px;font:inherit;margin-bottom:10px}
#stat{color:var(--sub);font-size:14px;min-height:20px;margin:0 0 6px}
.row{position:relative;border-radius:22px;margin:2px 0;overflow:hidden;touch-action:pan-y}
.row .bg{position:absolute;inset:0;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:700;display:flex;align-items:center;padding-left:24px}
.row .fg{position:relative;display:flex;align-items:center;gap:16px;padding:8px;background:var(--bg);border-radius:22px;min-height:96px}
.row.on .fg{background:var(--sel)}
.row.on b{color:var(--accent)}
.th{width:80px;height:80px;flex:none;border-radius:18px;background:var(--surface2);overflow:hidden;display:grid;place-items:center}
.th img{width:100%;height:100%;object-fit:cover}.th svg{width:50%}
.tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.tx b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{color:var(--sub);font-size:14px;display:flex;align-items:center;gap:6px}
.tx small svg{height:13px;width:auto;flex:none}
#idx{position:fixed;right:4px;top:calc(env(safe-area-inset-top,0px) + 70px);bottom:150px;width:28px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;background:var(--surface);border-radius:14px;padding:6px 0;font-size:12px;font-weight:700;color:var(--sub);z-index:2}
#idx button{font-size:12px;font-weight:700;color:var(--sub);padding:0;line-height:1}
#pill{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:8px 8px 12px 10px;display:flex;align-items:center;gap:12px;overflow:hidden}
#pill .go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
#pill .th{width:48px;height:48px;border-radius:12px}
#pill .tx b{font-size:16px}
#pill .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.ib{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib svg{width:30px;height:30px}.ib.t{color:var(--sub);font-weight:700;font-size:14px}
.pp{width:72px;height:72px;background:var(--accent);color:#fff}.pp svg{width:40px;height:40px}
#pill .pp{width:48px;height:48px}#pill .pp svg{width:28px;height:28px}
#np{z-index:10;overflow-y:auto;align-items:center;text-align:center;padding-left:20px;padding-right:20px}
#np .hd{width:100%;display:flex;justify-content:space-between;padding:8px 0}
.cover{width:min(76vw,36dvh,340px);aspect-ratio:1;border-radius:7%;background:var(--surface2);display:grid;place-items:center;overflow:hidden;margin:8px 0 18px;box-shadow:0 20px 50px -20px color-mix(in srgb,var(--accent2) 60%,transparent)}
.cover img{width:100%;height:100%;object-fit:cover}.cover svg{width:28%}
#np h1{margin:0;font-size:22px;overflow-wrap:anywhere}
.artist{color:var(--sub);margin:2px 0 6px}
.badge{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:14px;min-height:22px}.badge svg{height:16px;width:auto}
.details{color:var(--sub);font-size:13px;min-height:18px}
.seekwrap{width:100%;margin-top:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:0;background:transparent;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2)) 0 0/var(--p) 100% no-repeat,var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--text)}
input[type=range]:disabled{opacity:.5}
.times{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:center;gap:4px;margin:8px 0 4px}
.shuf{color:var(--sub);font-weight:700;min-height:44px;padding:0 16px}.shuf[aria-pressed="true"]{color:var(--accent)}
#set{z-index:20;padding:calc(env(safe-area-inset-top,0px) + 8px) 20px 8px}
#set h2{margin:12px 0 4px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:60px}
.item small{display:block;color:var(--sub);font-size:13px}
.item[disabled]{opacity:.55;cursor:default}
#setup{z-index:30;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
#setup svg{width:96px}#setup p{color:var(--sub);max-width:30ch;margin:0}
.btn{background:var(--accent);color:#fff;border-radius:999px;min-height:52px;padding:0 28px;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:50;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="66" y2="0"><stop offset="0" stop-color="#ff4e78"/><stop offset="1" stop-color="#8246eb"/></linearGradient>
<symbol id="wave" viewBox="0 0 66 40"><g fill="url(#g)"><rect x="0" y="15.6" width="6" height="8.8" rx="3"/><rect x="10" y="11.6" width="6" height="16.8" rx="3"/><rect x="20" y="6.8" width="6" height="26.4" rx="3"/><rect x="30" y="2" width="6" height="36" rx="3"/><rect x="40" y="6.8" width="6" height="26.4" rx="3"/><rect x="50" y="11.6" width="6" height="16.8" rx="3"/><rect x="60" y="15.6" width="6" height="8.8" rx="3"/></g></symbol>
</defs></svg>

<main class="scr" id="lib">
  <div class="top"><button class="pillbtn" id="openSet">⚙ Settings</button></div>
  <div class="hero"><div class="ic"><svg viewBox="0 0 66 40" style="filter:brightness(0) invert(1)"><use href="#wave"/></svg></div><h1>All Songs</h1></div>
  <div class="acts">
    <button class="pillbtn" id="bShuf" aria-label="Shuffle all">⤨</button>
    <button class="pillbtn" id="bPlay" aria-label="Play all">▶</button>
    <button class="pillbtn" id="bSearch" aria-label="Search">⌕</button>
  </div>
  <input id="q" type="search" placeholder="Search songs, artists, albums" hidden>
  <p id="stat" role="status"></p>
  <div id="list"></div>
</main>
<nav id="idx" aria-label="Jump to letter"></nav>

<div id="pill" hidden>
  <button class="go" id="pillGo" aria-label="Open player"><span class="th" id="pTh"></span><span class="tx"><b id="pT"></b><span id="pA" style="color:var(--sub)"></span></span></button>
  <button class="ib pp" id="pPp" aria-label="Play"></button>
  <div class="bar" id="pBar"></div>
</div>

<section class="scr" id="np" hidden>
  <div class="hd"><button class="pillbtn" id="mini" aria-label="Minimize player">⌄ Minimize</button></div>
  <div class="cover" id="cover"></div>
  <h1 id="title"></h1><div class="artist" id="artist"></div>
  <div class="badge" id="badge"></div><div class="details" id="details"></div>
  <div class="seekwrap"><input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled aria-label="Seek"><div class="times"><span id="tc">0:00</span><span id="tt">0:00</span></div></div>
  <div class="ctrl">
    <button class="ib t" id="back" aria-label="Back 10 seconds">−10</button>
    <button class="ib" id="prev" aria-label="Previous song"><svg viewBox="0 0 24 24"><rect x="6" y="6.5" width="2" height="11" rx="1" fill="currentColor"/><path d="M18 6.5v11l-8.5-5.5z" fill="currentColor"/></svg></button>
    <button class="ib pp" id="pp" aria-label="Play"></button>
    <button class="ib" id="next" aria-label="Next song"><svg viewBox="0 0 24 24"><rect x="16" y="6.5" width="2" height="11" rx="1" fill="currentColor"/><path d="M6 6.5v11l8.5-5.5z" fill="currentColor"/></svg></button>
    <button class="ib t" id="fwd" aria-label="Forward 10 seconds">+10</button>
  </div>
  <button class="shuf" id="shuf" aria-pressed="false">Shuffle</button>
</section>

<section class="scr" id="set" hidden>
  <button class="pillbtn" id="setBack" style="align-self:flex-start;margin:8px 0">← Back</button>
  <h2>Settings</h2>
  <button class="item" id="chFolder"><span>Music folder<small id="folderName">Not chosen</small></span><span>Change</span></button>
  <button class="item" id="rescan"><span>Rescan library<small>Pick up songs you added or removed</small></span><span>Scan</span></button>
  <button class="item" id="theme"><span>Theme<small>Switch between light and dark</small></span><span>◐</span></button>
  <button class="item" disabled><span>Bit-perfect audio<small>Not available yet. It needs a native audio engine, which isn’t built in this version.</small></span><span>Off</span></button>
</section>

<section class="scr" id="setup" hidden>
  <svg viewBox="0 0 66 40" aria-hidden="true"><use href="#wave"/></svg>
  <h1 style="margin:0">Choose your music folder</h1>
  <p id="setupMsg">Pick the folder that holds your songs. Subfolders are included.</p>
  <button class="btn" id="pick">Select folder</button>
</section>
<div id="toast" hidden></div>
<audio id="audio" preload="metadata" playsinline></audio>

<script>
(()=>{
const $=s=>document.querySelector(s),A=$('#audio'),root=document.documentElement;
const C=window.Capacitor||{},P=C.Plugins||{},Lib=P.MusicLibrary,NA=P.NativeAudio;
const conv=p=>p&&C.convertFileSrc?C.convertFileSrc('file://'+p):'';
const PLAY='<svg viewBox="0 0 24 24"><path d="M9 6.5v11l9-5.5z" fill="currentColor"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><rect x="8" y="6.5" width="2.8" height="11" rx="1" fill="currentColor"/><rect x="13.2" y="6.5" width="2.8" height="11" rx="1" fill="currentColor"/></svg>';
const WAVE='<svg viewBox="0 0 66 40" aria-hidden="true"><use href="#wave"/></svg>';
let L=[],V=[],Q=[],qi=-1,tok=0,loaded=false,shuf=false,dragging=false,nTok=0,tT;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(tT);tT=setTimeout(()=>e.hidden=true,2200)}
const cur=()=>Q[qi];
const dur=()=>isFinite(A.duration)&&A.duration>0?A.duration:(cur()?cur().length:0);
const playing=()=>loaded&&!A.paused&&!A.ended;

/* ---------- library ---------- */
function prep(t){
  t.artUrl=conv(t.art);
  t.lossless=/^(flac|wav)$/.test(t.ext);
  const d=[fmt(t.length),t.ext];if(t.rate)d.push(+(t.rate/1000).toFixed(3)+' kHz');if(t.bits)d.push(t.bits+' bit');
  t.details=d.join(' | ');
  t.badge=t.lossless?((t.bits>16||t.rate>48000)?'Hi-Res Lossless':'Lossless'):'';
  const c=(t.title.trim()[0]||'#').toUpperCase();t.letter=/[A-Z]/.test(c)?c:'#';
}
const thumb=t=>t&&t.artUrl?'<img alt="" loading="lazy" src="'+t.artUrl+'">':WAVE;
function renderList(){
  const f=$('#q').value.trim().toLowerCase();
  V=f?L.filter(t=>(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(f)):L;
  $('#list').innerHTML=V.map((t,i)=>'<div class="row" data-i="'+i+'" data-l="'+t.letter+'"><div class="bg">Play next</div><div class="fg"><span class="th">'+thumb(t)+'</span><span class="tx"><b>'+esc(t.title)+'</b><span>'+esc(t.artist+(t.album?' - '+t.album:''))+'</span><small>'+(t.lossless?WAVE:'')+esc(t.details)+'</small></span></div></div>').join('')||'<p class="details" style="padding:24px 0">No songs found.</p>';
  const letters='#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  $('#idx').innerHTML=letters.map(l=>'<button data-j="'+l+'">'+l+'</button>').join('');
  mark();
}
function mark(){document.querySelectorAll('#list .row').forEach(r=>r.classList.toggle('on',V[+r.dataset.i]===cur()))}
async function loadLibrary(force){
  if(!Lib){$('#setupMsg').textContent='Open this in the Android app to choose a folder.';$('#setup').hidden=false;$('#pick').hidden=true;return}
  const f=await Lib.getFolder().catch(()=>({}));
  if(!f.uri){$('#setup').hidden=false;return}
  $('#setup').hidden=true;$('#folderName').textContent=f.name||'';
  $('#stat').textContent=force?'Scanning your music…':'';
  try{
    const r=await Lib.scan({force:!!force});
    L=(r.tracks||[]);L.forEach(prep);
    L.sort((a,b)=>a.title.localeCompare(b.title,undefined,{sensitivity:'base'}));
    $('#stat').textContent=L.length?L.length+' songs':'No songs found in this folder.';
    renderList();
  }catch(e){$('#stat').textContent='Couldn’t read that folder. Try choosing it again.'}
}
async function pickFolder(){
  try{await Lib.pickFolder()}catch(e){return}
  $('#set').hidden=true;await loadLibrary(true);
}

/* ---------- queue + playback ---------- */
function startQueue(list,i){Q=list.slice();qi=i;playCur();show('np')}
async function playCur(){
  const t=cur();if(!t)return;const my=++tok;loaded=false;render();
  try{
    const r=await Lib.prepare({uri:t.uri,ext:t.ext});if(my!==tok)return;
    A.src=conv(r.path);loaded=true;
    A.play().catch(()=>toast('Can’t play this file on this device.'));
  }catch(e){if(my===tok)toast('Couldn’t open this song.')}
  render();
}
function next(){if(!Q.length)return;qi=shuf&&Q.length>1?(()=>{let i;do{i=Math.floor(Math.random()*Q.length)}while(i===qi);return i})():(qi+1)%Q.length;playCur()}
function prev(){if(!Q.length)return;if(loaded&&A.currentTime>3)A.currentTime=0;else{qi=(qi-1+Q.length)%Q.length;playCur()}}
function toggle(){if(!cur())return;if(!loaded)return playCur();A.paused?A.play().catch(()=>{}):A.pause()}
function skip(d){if(loaded){const m=dur();A.currentTime=Math.max(0,m?Math.min(A.currentTime+d,m-.5):A.currentTime+d)}}
function playNext(t){
  if(!Q.length){startQueue([t],0);return}
  Q.splice(qi+1,0,t);toast('Playing next: '+t.title);
}
function shuffleAll(){const a=L.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.length)startQueue(a,0)}

/* ---------- UI ---------- */
const S=$('#seek'),fill=()=>S.style.setProperty('--p',(S.value/10)+'%');
function tick(){
  const d=dur();
  if(!dragging){S.value=d?Math.min(1000,A.currentTime/d*1000):0;fill();$('#tc').textContent=fmt(A.currentTime)}
  $('#tt').textContent=fmt(d);$('#pBar').style.width=(d?A.currentTime/d*100:0)+'%';
}
function syncPlay(){for(const b of [$('#pp'),$('#pPp')]){b.innerHTML=playing()?PAUSE:PLAY;b.setAttribute('aria-label',playing()?'Pause':'Play')}}
function render(){
  const t=cur();
  $('#pill').hidden=!t;
  $('#cover').innerHTML=thumb(t);$('#pTh').innerHTML=thumb(t);
  $('#title').textContent=t?t.title:'';$('#artist').textContent=t?t.artist:'';
  $('#pT').textContent=t?t.title:'';$('#pA').textContent=t?t.artist:'';
  $('#badge').innerHTML=t&&t.badge?WAVE+'<span>'+esc(t.badge)+'</span>':'';
  $('#details').textContent=t?t.details:'';
  S.disabled=!loaded;if(!loaded){S.value=0;fill();$('#tc').textContent='0:00'}
  $('#tt').textContent=fmt(t?t.length:0);
  syncPlay();mark();
}
function show(v){
  $('#np').hidden=v!=='np';$('#set').hidden=v!=='set';
  $('#pill').style.display=v==='np'||v==='set'?'none':'';
}
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-j]');
  if(j){const l=j.dataset.j,r=document.querySelector('#list .row[data-l="'+l+'"]');if(r)r.scrollIntoView({block:'start'})}
});

/* swipe a row to the right = play next; tap = play from here */
let sx=0,sy=0,sr=null,lock='',dx=0,moved=false;
$('#list').addEventListener('pointerdown',e=>{sr=e.target.closest('.row');if(!sr)return;sx=e.clientX;sy=e.clientY;lock='';dx=0;moved=false});
$('#list').addEventListener('pointermove',e=>{
  if(!sr)return;const x=e.clientX-sx,y=e.clientY-sy;
  if(!lock&&(Math.abs(x)>10||Math.abs(y)>10))lock=Math.abs(x)>Math.abs(y)?'h':'v';
  if(lock==='h'){moved=true;dx=Math.max(0,Math.min(x,160));sr.querySelector('.fg').style.transform='translateX('+dx+'px)'}
});
function endSwipe(){
  if(!sr)return;const fg=sr.querySelector('.fg');fg.style.transition='transform .18s';fg.style.transform='';setTimeout(()=>fg.style.transition='',200);
  if(lock==='h'&&dx>90)playNext(V[+sr.dataset.i]);
  sr=null;
}
$('#list').addEventListener('pointerup',()=>{const hit=sr&&!moved&&lock==='',r=sr;endSwipe();if(hit&&r)startQueue(V,+r.dataset.i)});
$('#list').addEventListener('pointercancel',endSwipe);

$('#pPp').onclick=$('#pp').onclick=toggle;
$('#pillGo').onclick=()=>show('np');$('#mini').onclick=()=>show('lib');
$('#prev').onclick=prev;$('#next').onclick=next;$('#back').onclick=()=>skip(-10);$('#fwd').onclick=()=>skip(10);
$('#shuf').onclick=()=>{shuf=!shuf;$('#shuf').setAttribute('aria-pressed',String(shuf))};
$('#bShuf').onclick=shuffleAll;$('#bPlay').onclick=()=>{if(V.length)startQueue(V,0)};
$('#bSearch').onclick=()=>{const q=$('#q');q.hidden=!q.hidden;if(!q.hidden)q.focus();else{q.value='';renderList()}};
$('#q').oninput=renderList;
$('#openSet').onclick=()=>show('set');$('#setBack').onclick=()=>show('lib');
$('#pick').onclick=pickFolder;$('#chFolder').onclick=pickFolder;
$('#rescan').onclick=async()=>{show('lib');await loadLibrary(true)};
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const st=ls.get('mp_theme');if(st==='dark'||st==='light')root.dataset.theme=st;
$('#theme').onclick=()=>{const n=isDark()?'light':'dark';root.dataset.theme=n;ls.set('mp_theme',n)};
S.oninput=()=>{dragging=true;$('#tc').textContent=fmt(S.value/1000*dur());fill()};
S.onchange=()=>{const d=dur();if(d&&loaded)A.currentTime=Math.min(S.value/1000*d,Math.max(0,d-.5));dragging=false};
['timeupdate','durationchange','loadedmetadata'].forEach(ev=>A.addEventListener(ev,tick));
A.addEventListener('play',syncPlay);A.addEventListener('pause',syncPlay);
A.addEventListener('ended',next);
A.addEventListener('error',()=>{if(A.getAttribute('src'))toast('Can’t play this file on this device.')});

/* ---------- background playback + lock-screen controls (native) ---------- */
async function artOf(t){
  if(!t||!t.artUrl)return'';
  try{const bm=await createImageBitmap(await (await fetch(t.artUrl)).blob()),s=Math.min(bm.width,bm.height),c=document.createElement('canvas');
    c.width=c.height=320;c.getContext('2d').drawImage(bm,(bm.width-s)/2,(bm.height-s)/2,s,s,0,0,320,320);return c.toDataURL('image/jpeg',.8).split(',')[1]||''}catch(e){return''}
}
let artCache={u:null,b:''};
async function nativeSync(){
  if(!NA||!loaded||!cur())return;const t=cur(),my=++nTok;
  if(artCache.u!==t.uri){const b=await artOf(t);artCache={u:t.uri,b};if(my!==nTok)return}
  try{NA.update({title:t.title,artist:t.artist,album:t.album,playing:playing(),position:A.currentTime||0,duration:dur(),art:artCache.b})}catch(e){}
}
if(NA){
  ['play','pause','seeked','loadedmetadata'].forEach(ev=>A.addEventListener(ev,nativeSync));
  try{NA.addListener('action',e=>{switch(e&&e.action){
    case'play':if(loaded)A.play().catch(()=>{});else toggle();break;
    case'pause':A.pause();break;case'toggle':toggle();break;case'next':next();break;case'prev':prev();break;
    case'seek':if(loaded&&e.position!=null)A.currentTime=e.position;break}})}catch(e){}
}

render();loadLibrary(false);
})();
</script>
